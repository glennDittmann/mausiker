[package]
name = "mausiker"
version = "0.1.0"
description = "A tool for helping managing a music library."
authors = ["glennDittmann <glenn.dittmann@posteo.de>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
lofty = "0.25.0"
walkdir = "2.5.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
